# Шлюз cognee: индексация — в отдельный процесс, остальное — в API.
#
# Блокировки датасета и improve в cognee живут в памяти процесса
# (cognee/infrastructure/locks/dataset_lock.py, session_lock.py), поэтому всё,
# что запускает конвейер или берёт эти блокировки, обязано попадать в ОДИН
# процесс — cognee-indexer. Recall, session/trace (remember/entry) и прочее
# чтение остаются в cognee-api и больше не делят event loop с cognify.
# План и инварианты: ops/indexer-split/PLAN.md в /home/itrous/src/cognee.

worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Журнал только неуспешных ответов: кто, что и в какой процесс — для разбора 4xx/5xx.
    map $status $cognee_log_failed {
        ~^[45]  1;
        default 0;
    }
    log_format cognee_failed '$time_iso8601 $remote_addr "$request" $status '
                             '$cognee_backend ua="$http_user_agent" rt=$request_time';
    access_log /dev/stdout cognee_failed if=$cognee_log_failed;

    # Совпадение — по "МЕТОД путь" ($uri — путь без строки запроса).
    map "$request_method $uri" $cognee_backend {
        default                                                        cognee_api;
        "~^POST /api/v1/(remember|add|cognify|memify|improve|forget|skills|sync)/?$"  cognee_indexer;
        "~^POST /api/v1/responses/?$"                                  cognee_indexer;
        "~^PATCH /api/v1/update/?$"                                    cognee_indexer;
        "~^DELETE /api/v1/delete/?$"                                   cognee_indexer;
        "~^DELETE /api/v1/skills/[^/]+/?$"                             cognee_indexer;
        "~^DELETE /api/v1/datasets(/[^/]+(/data/[^/]+)?)?/?$"          cognee_indexer;
        "~^GET /api/v1/remember/jobs/[^/]+/?$"                         cognee_indexer;
        "~^POST /api/v1/slack/history/[^/]+/import/?$"                 cognee_indexer;
        "~^PUT /api/v1/slack/history/[^/]+/sync/?$"                    cognee_indexer;
        "~^POST /api/v1/integrations/[^/]+/sync/?$"                    cognee_indexer;
        # events ведёт к импорту истории (dataset_lock), DELETE connection?delete_data — к forget.
        "~^POST /api/v1/integrations/[^/]+/events/?$"                  cognee_indexer;
        "~^DELETE /api/v1/integrations/[^/]+/connection/?$"            cognee_indexer;
        # OAuth callback запускает on_installed (у GitHub — начальная синхронизация через remember).
        "~^GET /api/v1/integrations/[^/]+/callback/?$"                 cognee_indexer;
    }

    # Docker DNS с перечитыванием: пересозданный контейнер получает новый IP,
    # а статически разрешённый адрес оставил бы шлюз смотреть в пустоту.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream cognee_api {
        zone cognee_api 64k;
        server cognee:8000 resolve;
        keepalive 32;
        # Меньше keep-alive uvicorn (5 с): иначе nginx переиспользует соединение, которое
        # апстрим как раз закрывает, и запрос получает reset (видели на GET /remember/jobs).
        keepalive_timeout 4s;
    }

    upstream cognee_indexer {
        zone cognee_indexer 64k;
        server cognee-indexer:8000 resolve;
        keepalive 8;
        keepalive_timeout 4s;
    }

    server {
        listen 8000;

        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Какой процесс ответил — для проверки маршрутизации.
        add_header X-Cognee-Backend $cognee_backend always;

        location / {
            proxy_pass http://$cognee_backend;
        }
    }
}
